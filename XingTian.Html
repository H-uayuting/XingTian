<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TGNMOS · 品牌形象</title>
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #ff2d55;
            --secondary: #7c3aed;
            --accent: #06d6a0;
            --glow-pink: #ff2d55;
            --glow-blue: #3b82f6;
            --glow-purple: #8b5cf6;
            --bg-dark: #0a0a12;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --radius: 24px;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            --font-sans: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 动态背景层 ========== */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 渐变光晕叠加 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(124, 58, 237, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 45, 85, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(6, 214, 160, 0.06) 0%, transparent 50%);
        }

        /* ========== 主容器 ========== */
        .app {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 20px 40px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--glow-pink), var(--glow-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.25);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, rgba(255, 255, 255, 0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            font-size: 10px;
            font-weight: 600;
            color: var(--glow-pink);
            background: rgba(255, 45, 85, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 45, 85, 0.2);
            letter-spacing: 0.3px;
            -webkit-text-fill-color: var(--glow-pink);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        /* ========== 主标题区 ========== */
        .hero {
            text-align: center;
            padding: 20px 0 12px;
            flex-shrink: 0;
        }

        .hero-title {
            font-size: clamp(2.6rem, 10vw, 4rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -1.5px;
            position: relative;
            display: inline-block;
        }

        .hero-title .text-glow {
            background: linear-gradient(135deg, #ff2d55 0%, #8b5cf6 40%, #3b82f6 70%, #06d6a0 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease-in-out infinite alternate;
            position: relative;
            filter: drop-shadow(0 0 40px rgba(139, 92, 246, 0.25));
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .hero-title .text-outline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.06);
            -webkit-text-fill-color: transparent;
            z-index: -1;
            transform: translate(4px, 4px);
            animation: float-outline 6s ease-in-out infinite;
        }

        @keyframes float-outline {
            0%,
            100% {
                transform: translate(4px, 4px) scale(1);
            }
            50% {
                transform: translate(-2px, -2px) scale(1.02);
            }
        }

        .hero-sub {
            margin-top: 12px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: var(--text-secondary);
            letter-spacing: 2px;
            font-weight: 300;
            animation: fade-up 1s ease-out 0.3s both;
        }

        .hero-sub span {
            color: var(--accent);
            font-weight: 500;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 装饰动画文字 ========== */
        .word-art {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 16px 0 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .word-art span {
            font-size: clamp(0.7rem, 1.8vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            animation: word-float 4s ease-in-out infinite alternate;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .word-art span:nth-child(1) {
            animation-delay: 0s;
            border-color: rgba(255, 45, 85, 0.2);
        }
        .word-art span:nth-child(2) {
            animation-delay: 0.4s;
            border-color: rgba(139, 92, 246, 0.2);
        }
        .word-art span:nth-child(3) {
            animation-delay: 0.8s;
            border-color: rgba(59, 130, 246, 0.2);
        }
        .word-art span:nth-child(4) {
            animation-delay: 1.2s;
            border-color: rgba(6, 214, 160, 0.2);
        }
        .word-art span:nth-child(5) {
            animation-delay: 1.6s;
            border-color: rgba(255, 45, 85, 0.15);
        }

        @keyframes word-float {
            0% {
                transform: translateY(0px) scale(1);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-6px) scale(1.04);
                opacity: 1;
            }
        }

        /* ========== 图片链接区 ========== */
        .image-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 24px 0 18px;
            flex-shrink: 0;
        }

        .image-card {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-shadow: var(--shadow);
        }

        .image-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.08), rgba(139, 92, 246, 0.08));
            z-index: 1;
            transition: opacity 0.4s;
        }

        .image-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
        }

        .image-card:active {
            transform: scale(0.96);
            transition-duration: 0.1s;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .image-card:hover img {
            transform: scale(1.06);
        }

        .image-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 16px 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7) 60%);
            z-index: 2;
            color: #fff;
        }

        .image-card .overlay .label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .image-card .overlay .label .arrow {
            transition: transform 0.3s;
            display: inline-block;
        }

        .image-card:hover .overlay .label .arrow {
            transform: translateX(4px);
        }

        .image-card .overlay .desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
            font-weight: 300;
        }

        /* 图片卡片颜色主题 */
        .image-card.card-1 {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }
        .image-card.card-1 .overlay .label {
            color: #f472b6;
        }

        .image-card.card-2 {
            background: linear-gradient(135deg, #1e1e2f, #0f172a);
        }
        .image-card.card-2 .overlay .label {
            color: #60a5fa;
        }

        /* ========== 社交链接区 ========== */
        .social-section {
            margin: 16px 0 20px;
            flex-shrink: 0;
        }

        .social-section .section-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-section .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.06), transparent);
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .social-link:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link:active {
            transform: scale(0.95);
            transition-duration: 0.1s;
        }

        .social-link .icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .social-link:hover .icon {
            transform: scale(1.08) rotate(-4deg);
        }

        .social-link .info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .social-link .info .name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
        }

        .social-link .info .hint {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .social-link .badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(255, 45, 85, 0.12);
            color: var(--glow-pink);
            border: 1px solid rgba(255, 45, 85, 0.1);
            flex-shrink: 0;
        }

        /* 每个社交链接的个性颜色 */
        .social-link.qq .icon {
            background: rgba(0, 153, 255, 0.15);
            color: #0099ff;
        }
        .social-link.qq:hover {
            border-color: rgba(0, 153, 255, 0.25);
        }

        .social-link.weibo .icon {
            background: rgba(255, 0, 0, 0.12);
            color: #ff4d4d;
        }
        .social-link.weibo:hover {
            border-color: rgba(255, 0, 0, 0.2);
        }

        .social-link.email .icon {
            background: rgba(6, 214, 160, 0.12);
            color: #06d6a0;
        }
        .social-link.email:hover {
            border-color: rgba(6, 214, 160, 0.2);
        }

        .social-link.more .icon {
            background: rgba(139, 92, 246, 0.12);
            color: #8b5cf6;
        }
        .social-link.more:hover {
            border-color: rgba(139, 92, 246, 0.2);
        }

        /* ========== 创作者信息 ========== */
        .creator-section {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .creator-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .creator-badge:hover {
            border-color: rgba(255, 45, 85, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .creator-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--glow-pink), var(--glow-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 45, 85, 0.15);
            flex-shrink: 0;
        }

        .creator-badge .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .creator-badge .verify {
            font-size: 10px;
            font-weight: 600;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.12);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .creator-badge .verify svg {
            width: 12px;
            height: 12px;
            fill: #fbbf24;
        }

        .creator-badge .tag {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .creator-footer {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
            padding-bottom: 4px;
        }

        .creator-footer .update-time {
            color: var(--text-secondary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .creator-footer .update-time .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        /* ========== 底部装饰 ========== */
        .footer-deco {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .footer-deco span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            animation: deco-pulse 3s ease-in-out infinite alternate;
        }

        .footer-deco span:nth-child(2) {
            animation-delay: 0.5s;
            background: rgba(255, 45, 85, 0.15);
        }
        .footer-deco span:nth-child(3) {
            animation-delay: 1s;
            background: rgba(139, 92, 246, 0.15);
        }
        .footer-deco span:nth-child(4) {
            animation-delay: 1.5s;
            background: rgba(59, 130, 246, 0.15);
        }
        .footer-deco span:nth-child(5) {
            animation-delay: 2s;
            background: rgba(6, 214, 160, 0.15);
        }

        @keyframes deco-pulse {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.6);
                opacity: 1;
            }
        }

        /* ========== 滚动条美化 ========== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        /* ========== 响应式 ========== */
        @media (min-width: 640px) {
            .app {
                max-width: 560px;
                padding: 28px 32px 48px;
            }
            .image-links {
                gap: 18px;
            }
            .social-grid {
                gap: 14px;
            }
            .social-link {
                padding: 16px 20px;
            }
        }

        @media (max-width: 380px) {
            .app {
                padding: 14px 14px 28px;
            }
            .hero-title {
                font-size: 2.2rem;
            }
            .social-grid {
                gap: 8px;
            }
            .social-link {
                padding: 10px 12px;
                gap: 8px;
            }
            .social-link .icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .social-link .info .name {
                font-size: 12px;
            }
            .image-links {
                gap: 10px;
            }
            .brand-name {
                font-size: 16px;
            }
            .brand-badge {
                font-size: 8px;
                padding: 1px 8px;
            }
        }

        /* ========== 加载动画 ========== */
        .app {
            animation: app-fade 0.8s ease-out both;
        }

        @keyframes app-fade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 动态更新提示条 ========== */
        .update-banner {
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .update-banner .sparkle {
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 防误触优化 */
        .social-link,
        .image-card {
            touch-action: manipulation;
        }

        /* 大手机专属优化 (iPhone Pro Max 等) */
        @media (min-width: 428px) and (max-width: 500px) {
            .app {
                max-width: 100%;
                padding: 24px 28px 40px;
            }
            .hero-title {
                font-size: 3.6rem;
            }
            .image-links {
                gap: 16px;
            }
            .social-grid {
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 动态背景 Canvas ===== -->
    <canvas id="bg-canvas"></canvas>
    <div class="bg-overlay"></div>

    <!-- ===== 主应用 ===== -->
    <div class="app">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">✦</div>
                <span class="brand-name">TGNMOS</span>
                <span class="brand-badge">· 认证</span>
            </div>
            <div class="header-status">
                <span class="status-dot"></span>
                <span>在线</span>
            </div>
        </header>

        <!-- ===== 主标题 ===== -->

    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            'use strict';

            // ========================================
            // 1. 动态背景 Canvas (粒子系统)
            // ========================================
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];
            const PARTICLE_COUNT = 70;
            const CONNECTION_DIST = 120;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.35;
                    this.vy = (Math.random() - 0.5) * 0.35;
                    this.radius = Math.random() * 2 + 1.2;
                    this.opacity = Math.random() * 0.4 + 0.15;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > w) this.vx *= -1;
                    if (this.y < 0 || this.y > h) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawLines() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECTION_DIST) {
                            const alpha = (1 - dist / CONNECTION_DIST) * 0.18;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateBg() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                drawLines();
                requestAnimationFrame(animateBg);
            }
            animateBg();

            // ========================================
            // 2. 动态时间更新 (显示在 footer)
            // ========================================
            const timeEl = document.getElementById('live-time');

            function updateTime() {
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                timeEl.textContent =
                    pad(now.getHours()) + ':' +
                    pad(now.getMinutes()) + ':' +
                    pad(now.getSeconds());
            }
            updateTime();
            setInterval(updateTime, 1000);

            // ========================================
            // 3. 页面交互增强: 卡片点击反馈 & 统计
            // ========================================
            const cards = document.querySelectorAll('.image-card, .social-link');
            cards.forEach(el => {
                el.addEventListener('click', function(e) {
                    // 触感反馈 (移动端)
                    if ('vibrate' in navigator && window.innerWidth < 768) {
                        navigator.vibrate && navigator.vibrate(10);
                    }
                    // 简单的自定义事件追踪 (模拟)
                    const label = this.getAttribute('href') || 'link';
                    console.log('[TGNMOS] 交互:', label);
                });
            });

            // ========================================
            // 4. 自动更新检测 (模拟 "代码更新" 机制)
            // ========================================
            // 使用 localStorage 记录上次访问时间，显示更新状态
            const UPDATE_KEY = 'tgnmos_last_visit';
            const lastVisit = localStorage.getItem(UPDATE_KEY);
            const now = Date.now();

            if (lastVisit) {
                const diff = now - parseInt(lastVisit, 10);
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                // 如果超过 2 小时，显示更新提示
                if (hours > 2 || (hours === 0 && minutes > 30)) {
                    const banner = document.querySelector('.update-banner');
                    if (banner) {
                        banner.innerHTML = `
                            <span class="sparkle">✦</span>
                            已更新 · 上次访问 ${hours > 0 ? hours + 'h' : minutes + 'm'} 前
                            <span class="sparkle">✦</span>
                        `;
                    }
                }
            }
            // 记录本次访问时间
            localStorage.setItem(UPDATE_KEY, String(now));

            // ========================================
            // 5. 额外: 动态 "在线" 状态随机闪烁 (趣味)
            // ========================================
            const dot = document.querySelector('.status-dot');
            if (dot) {
                setInterval(() => {
                    const online = Math.random() > 0.08;
                    dot.style.opacity = online ? '1' : '0.2';
                    dot.style.background = online ? 'var(--accent)' : '#666';
                }, 3000);
            }

            // ========================================
            // 6. 控制台彩蛋
            // ========================================
            console.log('%c✦ TGNMOS · 数字艺术品牌 ✦', 'font-size:20px; font-weight:bold; color:#8b5cf6;');
            console.log('%c创作者 @TGNMOS | 认证黄V | 合作开放', 'font-size:13px; color:#a78bfa;');
            console.log('%c代码动态更新 · 版本 3.2.1', 'font-size:12px; color:#6b7280;');

            console.log('✨ 欢迎访问 TGNMOS 品牌形象页 ✨');

        })();
    </script>
